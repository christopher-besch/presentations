<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Forgejo Actions Notification Development</title>
    <meta name="description" content="Forgejo Actions Notification Development">
    <meta name="author" content="Christopher Besch">

    <link rel="stylesheet" href="../dist/reset.css">
    <link rel="stylesheet" href="../dist/reveal.css">
    <link rel="stylesheet" href="../dist/theme/custom_white.css">

    <!-- code highlighting theme -->
    <link rel="stylesheet" href="../static/oceanicnext.css">

    <link rel="stylesheet" href="./style.css">

    <script src="libs/chartJS/chart.js"></script>
    <script src="libs/chartJS/chartjs-plugin-annotation.min.js"></script>
    <script src="benchCharts.js" type="module"></script>
</head>

<body>
    <div class="reveal">
        <div class="slides">
            <div class="header-left">
                Forgejo Actions Notification Development
            </div>
            <div class="header-right">
                <em>Christopher Besch</em> &bullet;
                21st November 2025
            </div>
            <section>
                <section data-state="titleslide dark-background" data-background-image="./banner_water.jpg"
                    data-background-opacity="1.0">
                    <div class="half-part">
                        <h1 style="color: white; margin-bottom: 7vh;">Forgejo Actions Notification Development</h1>
                    </div>
                </section>
            </section>

            <section>
                <section>
                    <img src="architecture.svg" style="max-height: 50vh; max-width: 100vw;">
                </section>
            </section>
        </div>
    </div>

    <script src="../vendor/external_code/externalcode.js"></script>
    <script src="../dist/reveal.js"></script>
    <script src="../plugin/notes/notes.js"></script>
    <script src="../plugin/markdown/markdown.js"></script>
    <script src="../plugin/highlight/highlight.js"></script>
    <script src="../plugin/math/math.js"></script>
    <script>
        Reveal.initialize({
            controls: true,
            controlsTutorial: false,
            progress: false,
            slideNumber: "c/t",
            hashOneBasedIndex: false,
            hash: true,
            navigationMode: "linear",
            embedded: false,
            showNotes: false,
            transition: "slide",
            transitionSpeed: "default",
            backgroundTransition: "fade",
            pdfSeparateFragments: true,
            autoAnimateDuration: 0.4,

            margin: 0.04,
            width: 1280,
            height: 720,

            katex: {
                local: "../dwn_vendor/katex",
                trust: true,
                // needed for colouring
                strict: false,
            },
            plugins: [
                // needs to be before highlighting
                Externalcode,
                RevealMarkdown,
                RevealHighlight,
                RevealNotes,    //press S for speaker view
                RevealMath.KaTeX,
            ],
            scrollActivationWidth: null,
        });
    </script>
</body>

</html>
